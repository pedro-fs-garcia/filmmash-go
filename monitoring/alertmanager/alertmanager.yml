global:
  smtp_smarthost: '${SMTP_SMARTHOST}'
  smtp_from: '${ALERT_EMAIL_SENDER}'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'resend-emails'

receivers:
- name: 'resend-emails'
  email_configs:
  - to: '${ALERT_EMAIL_RECEIVER}'
    send_resolved: true