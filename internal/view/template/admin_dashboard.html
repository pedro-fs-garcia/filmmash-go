{{ template "base" . }}

{{ define "content" }}

<h1>Admin</h1>

<div class="admin-tmdb">
    <h2>Add films from TMDB</h2>
    <form class="film-search" role="search" onsubmit="return false">
        <input type="search" name="search" placeholder="Search TMDB by title…"
            autocomplete="off"
            hx-get="/admin/films/search?page=1"
            hx-trigger="input[target.value.trim().length >= 3] changed delay:300ms, search[target.value.trim().length >= 3]"
            hx-target="#admin-tmdb-results"
            hx-swap="innerHTML">
    </form>
    <div id="admin-tmdb-results"></div>
</div>

<h2>Users</h2>

<div class="admin-users">
    <table class="admin-user-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Zitadel sub</th>
                <th>Authz ID</th>
                <th>Display name</th>
                <th>Login name</th>
                <th>Roles</th>
                <th>Joined</th>
                <th class="num">Votes</th>
            </tr>
        </thead>
        <tbody id="admin-user-rows">
            {{ template "adminUsers" . }}
        </tbody>
    </table>
    {{ if not .Users }}
    <p class="admin-empty">No users to show.</p>
    {{ end }}
</div>

{{ end }}
