{{ template "base" . }}

{{ define "content" }}

<section class="freeze-frame">
    <header class="ff-head">
        <p class="ff-reel">Reel 1 of 5</p>
        <div class="ff-progress" role="progressbar" aria-label="Reel progress" aria-valuemin="0" aria-valuemax="5"
            aria-valuenow="1">
            <span class="ff-progress-fill" style="width: 20%"></span>
        </div>
    </header>

    <div class="ff-body">
        <figure class="ff-frame">
            <img class="ff-still"
                src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720'%3E%3Crect width='1280' height='720' fill='%2316130d'/%3E%3Ctext x='640' y='352' text-anchor='middle' font-family='Courier New,monospace' font-size='62' font-weight='bold' letter-spacing='16' fill='%23c9a24b'%3EFREEZE FRAME%3C/text%3E%3Ctext x='640' y='408' text-anchor='middle' font-family='Courier New,monospace' font-size='24' letter-spacing='8' fill='%23c9bfa6'%3Emock still%3C/text%3E%3C/svg%3E"
                alt="Placeholder still — the frame for this round is not wired up yet">
            <span class="ff-marks" aria-hidden="true"></span>
        </figure>

        <div class="ff-quiz">
            <h1 class="ff-question">Which scene is this?</h1>

            <ul class="ff-options">
                <li>
                    <button type="button" class="ff-option">
                        <span class="ff-key">A</span>
                        <span class="ff-title">The Maltese Falcon</span>
                    </button>
                </li>
                <li>
                    <button type="button" class="ff-option">
                        <span class="ff-key">B</span>
                        <span class="ff-title">Double Indemnity</span>
                    </button>
                </li>
                <li>
                    <button type="button" class="ff-option">
                        <span class="ff-key">C</span>
                        <span class="ff-title">Casablanca</span>
                    </button>
                </li>
                <li>
                    <button type="button" class="ff-option">
                        <span class="ff-key">D</span>
                        <span class="ff-title">The Big Sleep</span>
                    </button>
                </li>
            </ul>

            <button type="button" class="ff-next">
                <svg class="ff-next-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 5l9 7-9 7V5z"/>
                    <path d="M18 5v14"/>
                </svg>
                <span>Next Frame</span>
            </button>
        </div>
    </div>
</section>

{{ end }}
