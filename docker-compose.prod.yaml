# Production overrides for the VPS.
# Leave COMPOSE_PROFILES unset in the VPS .env so the local monitoring stack stays off; 
# Alloy ships telemetry to Grafana Cloud instead.
services:
  app:
    image: ghcr.io/pedro-fs-garcia/filmmash-go-app:${IMAGE_TAG:-latest}

  migrate:
    image: ghcr.io/pedro-fs-garcia/filmmash-go-migrate:${IMAGE_TAG:-latest}

  seed:
    image: ghcr.io/pedro-fs-garcia/filmmash-go-seed:${IMAGE_TAG:-latest}

  alloy:
    env_file:
      - .env
    volumes:
      - ./monitoring/alloy/config.cloud.alloy:/etc/alloy/config.alloy:ro
