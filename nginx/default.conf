server {
    listen 80;

    location / {
        proxy_pass http://app:8080;
        # $http_host keeps the port (localhost:8080); $host would strip it.
        proxy_set_header Host $http_host;
        # Overwrites any client-supplied X-Real-IP — the app trusts this header.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        return 404;
    }
}
